name: Build Samsung Galaxy M32 M325FV (OpenELA source test)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "samsung_galaxy_m32"
  DEVICE_CODENAME: "m32"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error=unused-variable"

  KERNEL_SOURCE: "https://github.com/Samo1408/android_kernel_samsung_mt6768.git"
  KERNEL_BRANCH: "openela"

  # Clang is downloaded from a release archive in a dedicated step below.
  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz"
  CLANG_BRANCH: ""
  # 64-bit Android GNU cross-compiler is on the google branch.
  GCC_GNU: true
  GCC_64_SOURCE: "https://github.com/rsuntk/toolchains.git"
  GCC_64_BRANCH: "google"
  # No 32-bit ARM toolchain source was supplied; keep this unset until verified.
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "rsuntk_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # Integrate FinaSU into the clean kernel source.
  KERNELSU_SOURCE: "https://github.com/LyraVoid/FinaSU.git"
  # FinaSU developer recommends dev for older kernels such as Linux 4.14.
  KERNELSU_BRANCH: "dev"
  KERNELSU_FOLDER: "FinaSU"
  KERNELSU_AUTO_GET: "false"
  KERNELSU_AUTO_FORK: ""
  KERNELSU_METHOD: "manual"

  # Temporarily disable SUSFS while testing the clean source and FinaSU.
  SUSFS_ENABLE: false
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "oneui_a11_linux4.14"
  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  HOOK_METHOD: "syscall"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  FREE_MORE_SPACE: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

jobs:
  build-kernel:
    name: Samsung Galaxy M32 M325FV (OpenELA source test)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure APT network retries and timeouts
        run: |
          sudo tee /etc/apt/apt.conf.d/99github-actions-network > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          EOF

      - name: Prepare compilation environment
        uses: ./.github/workflows/build-env

      - name: Clean pre-integrated KernelSU hooks, then integrate FinaSU
        uses: ./.github/workflows/build-ready

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # M32-specific extra options; intentionally empty until validated.

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: Build kernel
        uses: ./.github/workflows/build-process

      - name: Package AnyKernel3
        uses: ./.github/workflows/pack-process

      - name: Upload build artifacts
        uses: ./.github/workflows/upload-files
